name: DropRedo Browser Tests
description: Run your DropRedo browser tests, fail the job when they fail, and link the run report on the pull request.
author: DropRedo

branding:
  icon: check-circle
  color: purple

inputs:
  api-token:
    description: A DropRedo API token (API Tokens in the app). Pass it from a secret, for example secrets.DROPREDO_API_TOKEN.
    required: true
  trigger-id:
    description: The trigger to run, copied from the API tab of an application's or group's Triggers page.
    required: true
  browser:
    description: The browser to run in, chromium, firefox or webkit. Use a matrix to run several.
    required: false
    default: chromium
  environments:
    description: Environment IDs to run against, separated by commas or new lines. Empty runs every environment of the trigger.
    required: false
    default: ''
  wait:
    description: Wait for the result and fail the job when the run fails. Set to false to only start the run.
    required: false
    default: 'true'
  timeout-minutes:
    description: How long to wait for the result before failing the job.
    required: false
    default: '30'
  poll-interval-seconds:
    description: How often to ask DropRedo for the run's status while waiting.
    required: false
    default: '15'
  public-report:
    description: Give the run a public report page (steps, results and video, never step values or logs) to link from the pull request.
    required: false
    default: 'true'
  comment-on-pr:
    description: On a pull request, post the result and report link as a comment, updated in place on each run. Needs the pull-requests write permission.
    required: false
    default: 'true'
  github-token:
    description: The token used to comment on the pull request.
    required: false
    default: ${{ github.token }}
  pull-request-number:
    description: The pull request to comment on. Defaults to the one that triggered the workflow; empty skips the comment.
    required: false
    default: ${{ github.event.pull_request.number }}
  github-api-url:
    description: The GitHub API address, for GitHub Enterprise Server.
    required: false
    default: ${{ github.api_url }}
  api-url:
    description: The DropRedo app's address.
    required: false
    default: https://app.dropredo.com

outputs:
  execution-id:
    description: The run's ID.
    value: ${{ steps.run.outputs.execution-id }}
  status:
    description: The run's last status, for example running, completed, failed or force stopped.
    value: ${{ steps.run.outputs.status }}
  passed:
    description: true when the run finished with no failed tests. Empty when wait is false.
    value: ${{ steps.run.outputs.passed }}
  report-url:
    description: The public run report, or the run in the DropRedo app when the report is not public.
    value: ${{ steps.run.outputs.report-url }}
  app-url:
    description: The run in the DropRedo app.
    value: ${{ steps.run.outputs.app-url }}

runs:
  using: composite
  steps:
    - name: Run DropRedo tests
      id: run
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/run.sh"'
      env:
        DROPREDO_API_TOKEN: ${{ inputs.api-token }}
        DROPREDO_TRIGGER_ID: ${{ inputs.trigger-id }}
        DROPREDO_BROWSER: ${{ inputs.browser }}
        DROPREDO_ENVIRONMENTS: ${{ inputs.environments }}
        DROPREDO_WAIT: ${{ inputs.wait }}
        DROPREDO_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        DROPREDO_POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        DROPREDO_PUBLIC_REPORT: ${{ inputs.public-report }}
        DROPREDO_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        DROPREDO_API_URL: ${{ inputs.api-url }}
        DROPREDO_GITHUB_TOKEN: ${{ inputs.github-token }}
        DROPREDO_PR_NUMBER: ${{ inputs.pull-request-number }}
        DROPREDO_GITHUB_API_URL: ${{ inputs.github-api-url }}
